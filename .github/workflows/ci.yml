name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run knip
      - run: npm run validate
      - run: npm run build:db
      # Media assets are committed; remote Wikimedia refreshes are intentionally
      # kept out of CI because rate limits and missing historical images are
      # expected fallback cases.
      - run: npm run cache:media -- --reconcile-only
      - run: npm run check:media
      - run: npm run emdash:index
      - run: npm test
      - run: npm run copy:extract
      - run: npm run copy:lint
      # The build Deploy ships: the full profile for utdred.com. postbuild runs
      # check:perf. The production D1 and KV IDs are only required to deploy.
      - name: Build the site (production target)
        env:
          CLOUDFLARE_ENV: production
        run: npm run build
      - run: node scripts/check-worker-config.mjs production
      - run: npx wrangler deploy --config dist/server/wrangler.json --dry-run
      - run: npm run check:static
