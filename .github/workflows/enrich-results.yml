name: Enrich match sheets

on:
  schedule:
    # Monday evening UK (19:00 BST / 18:00 GMT). Backfills sheets after
    # weekend results once Transfermarkt / MUFCInfo catch up.
    - cron: "0 18 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-results
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Fetch any missing results
        id: fetch
        run: |
          npm run update | tee update.log
          n=$(grep -oP 'NEW_MATCHES=\K\d+' update.log || echo 0)
          echo "new=$n" >> "$GITHUB_OUTPUT"

      - name: Enrich and assess latest sheets
        id: enrich
        run: |
          mkdir -p data/raw
          curl -sL -o data/raw/england.csv https://raw.githubusercontent.com/jalapic/engsoccerdata/master/data-raw/england.csv || true
          set +e
          npm run enrich -- --write --refresh --strict --latest 3 | tee enrich.log
          status=${PIPESTATUS[0]}
          set -e
          complete=$(grep -oP 'SHEET_COMPLETE=\K\d+' enrich.log || echo 0)
          echo "complete=$complete" >> "$GITHUB_OUTPUT"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          {
            echo "## Match sheet check"
            echo
            echo '```'
            awk '/== match sheet/{flag=1} flag' enrich.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Validate and rebuild database
        run: |
          if git diff --quiet -- data/canonical public/dataset; then
            echo "no canonical changes"
          else
            npm run validate
            npm run build:db
            npm run export:dataset
          fi

      - name: Commit and push
        run: |
          git config user.name "unitedstats-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/canonical public/dataset
          if git diff --staged --quiet; then
            echo "nothing to commit"
          else
            git commit -m "data: enrich current-season match sheets"
            git push
          fi

      - name: Fail if the latest sheets are still incomplete
        if: steps.enrich.outputs.status == '2'
        run: |
          echo "Latest current-season match sheet is incomplete. See the job summary."
          exit 1
