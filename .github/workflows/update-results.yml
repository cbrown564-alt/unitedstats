name: Update results

on:
  schedule:
    # After the usual match windows: Sun/Mon (weekend games), Thu (midweek).
    - cron: "0 6 * * 0,1,4"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-results
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Fetch latest results
        id: fetch
        run: |
          npm run update | tee update.log
          n=$(grep -oP 'NEW_MATCHES=\K\d+' update.log || echo 0)
          echo "new=$n" >> "$GITHUB_OUTPUT"
          if [ -n "$(git status --porcelain -- data/canonical/upcoming.json)" ]; then
            echo "schedule=1" >> "$GITHUB_OUTPUT"
          else
            echo "schedule=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Enrich current-season match sheets
        if: steps.fetch.outputs.new != '0'
        run: |
          mkdir -p data/raw
          curl -sL -o data/raw/england.csv https://raw.githubusercontent.com/jalapic/engsoccerdata/master/data-raw/england.csv || true
          npm run enrich -- --write || echo "enrichment incomplete, results still committed"

      - name: Validate and rebuild database
        if: steps.fetch.outputs.new != '0' || steps.fetch.outputs.schedule != '0'
        run: |
          npm run validate
          npm run build:db
          npm run export:dataset

      - name: Commit and push
        if: steps.fetch.outputs.new != '0' || steps.fetch.outputs.schedule != '0'
        run: |
          git config user.name "unitedstats-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/canonical public/dataset
          if [ "${{ steps.fetch.outputs.new }}" != "0" ]; then
            git commit -m "data: ${{ steps.fetch.outputs.new }} new result(s) through $(date -u +%F)"
          else
            git commit -m "data: upcoming schedule through $(date -u +%F)"
          fi
          git push
