name: Publish editorial content

# A publish or unpublish in the EmDash admin sends this event (plugins/record-guard).
# The live routes already show the change; this snapshots production D1 to git
# so the seed, the prerendered pages and the Worker's record replay catch up,
# then calls Deploy. The nightly run catches a publish whose event was lost; it
# commits nothing when D1 and the seed agree.
on:
  repository_dispatch:
    types: [emdash-publish]
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-editorial
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.push.outputs.sha }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Snapshot D1 to the seed
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_EXPORT_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 export redthread-editorial --remote --config wrangler.jsonc --env production --output "$RUNNER_TEMP/d1.sql"
          sqlite3 "$RUNNER_TEMP/d1.db" < "$RUNNER_TEMP/d1.sql"
          npx emdash export-seed -d "$RUNNER_TEMP/d1.db" --with-content=all > "$RUNNER_TEMP/export.json"
          npx tsx scripts/emdash/snapshot-seed.mts "$RUNNER_TEMP/export.json"

      - name: Detect a change
        id: diff
        run: |
          if git diff --quiet -- content/emdash/seed.json; then
            echo "changed=0" >> "$GITHUB_OUTPUT"
          else
            echo "changed=1" >> "$GITHUB_OUTPUT"
            git diff --stat -- content/emdash/seed.json
          fi

      # The admin's record guard already refused bad references; these re-check
      # the whole seed against today's record before it reaches git.
      - name: Check the seed against the record
        if: steps.diff.outputs.changed == '1'
        run: |
          npm run validate
          npm run build:db
          npm run cache:media -- --reconcile-only
          npm run emdash:index
          npm test
          npm run copy:extract
          npm run copy:lint

      - name: Commit and push
        id: push
        if: steps.diff.outputs.changed == '1'
        env:
          ACTION: ${{ github.event.client_payload.action || 'snapshot' }}
          COLLECTION: ${{ github.event.client_payload.collection }}
          SLUG: ${{ github.event.client_payload.slug }}
        run: |
          git config user.name "unitedstats-bot"
          git config user.email "actions@users.noreply.github.com"
          git add content/emdash/seed.json
          subject="content: ${ACTION}"
          if [ -n "$COLLECTION" ]; then subject="$subject ${COLLECTION}/${SLUG}"; fi
          git commit -m "$subject (EmDash snapshot)"
          git push
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # Its push does not start the Deploy workflow (GITHUB_TOKEN), so call it.
  deploy:
    needs: snapshot
    if: always() && needs.snapshot.outputs.sha != ''
    uses: ./.github/workflows/deploy.yml
    with:
      ref: ${{ needs.snapshot.outputs.sha }}
    secrets: inherit
