name: Deploy

# Builds the hybrid Astro site for utdred.com and deploys the Worker
# (docs/EMDASH-MIGRATION-PLAN.md, Phase 3). It runs on a push to master and by
# hand. The data and publish workflows call it after they push, because a push
# made with GITHUB_TOKEN does not start other workflows.
on:
  push:
    branches: [master]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: The commit to deploy (the caller's pushed commit).
        type: string
        required: true

permissions:
  contents: read

# One deploy at a time. A newer queued run replaces an older queued one, but a
# deploy in progress always finishes.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # The Cloudflare token lives in this environment, so nothing deploys until
    # it exists, and it can require an approval.
    environment:
      name: production
      url: https://utdred.com
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run validate

      # prebuild rebuilds the database, media manifest and record index first.
      - name: Build the site
        env:
          CLOUDFLARE_ENV: production
        run: npm run build

      # Without IDs Wrangler would create new, empty resources and bind them.
      - name: Check the production bindings
        run: node scripts/check-worker-config.mjs production --deployable

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config dist/server/wrangler.json

      - name: Smoke-test utdred.com
        run: |
          node scripts/smoke-check.mjs
          node scripts/check-worker-config.mjs production --smoke https://utdred.com --allow-setup
